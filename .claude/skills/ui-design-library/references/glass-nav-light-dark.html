<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Liquid Glass Nav</title>
<style>
  /* Layout: a frosted pill centred over a soft colour field; a white glass lozenge slides to the active tab; the sun button swaps light and dark */
  :root {
    color-scheme: light;
    --glass-bg: rgba(255, 255, 255, .38);
    --glass-shadow: rgba(60, 50, 90, .28);
    --glass-border: rgba(255, 255, 255, .6);
    --lozenge: rgba(255, 255, 255, .9);
    --lozenge-shadow: rgba(60, 50, 90, .18);
    --fg: #1f2230;
    --muted: #6b6f80;
    --bg: #dfe8fb;
    --c1: #f4a4b6;
    --c2: #f1efe9;
    --c3: #f3e48c;
    --c4: #a9bccb;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --glass-bg: rgba(30, 32, 48, .45);
      --glass-shadow: rgba(0, 0, 0, .6);
      --glass-border: rgba(255, 255, 255, .16);
      --lozenge: rgba(255, 255, 255, .16);
      --lozenge-shadow: rgba(0, 0, 0, .4);
      --fg: #f1f3fb;
      --muted: #9aa0b8;
      --bg: #0d1020;
      --c1: #7a2f58;
      --c2: #1b1f3a;
      --c3: #5b4d1a;
      --c4: #1f3a52;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --glass-bg: rgba(30, 32, 48, .45);
    --glass-shadow: rgba(0, 0, 0, .6);
    --glass-border: rgba(255, 255, 255, .16);
    --lozenge: rgba(255, 255, 255, .16);
    --lozenge-shadow: rgba(0, 0, 0, .4);
    --fg: #f1f3fb;
    --muted: #9aa0b8;
    --bg: #0d1020;
    --c1: #7a2f58;
    --c2: #1b1f3a;
    --c3: #5b4d1a;
    --c4: #1f3a52;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 32px;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    transition: background .5s ease, color .5s ease;
  }
  .field {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(105deg, var(--c1) 0%, var(--c2) 35%, var(--c3) 70%, var(--c4) 100%);
    transition: background .5s ease;
  }
  .field::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(40% 35% at 70% 75%, var(--c3), transparent 70%);
    opacity: .7;
  }
  main { position: relative; z-index: 1; display: grid; gap: 28px; justify-items: center; width: 100%; }

  .liquid-nav {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px;
    border-radius: 999px;
    background: var(--glass-bg);
    backdrop-filter: blur(36px) saturate(180%);
    -webkit-backdrop-filter: blur(36px) saturate(180%);
    box-shadow:
      0 30px 60px -18px var(--glass-shadow),
      0 8px 20px -8px var(--glass-shadow),
      inset 0 0 0 1px var(--glass-border);
    transition: background .5s ease, box-shadow .5s ease;
    max-width: 100%;
  }
  .lozenge {
    position: absolute; top: 8px; bottom: 8px; left: 0; width: 0;
    border-radius: 999px;
    background: var(--lozenge);
    box-shadow: 0 6px 16px -6px var(--lozenge-shadow), inset 0 0 0 1px var(--glass-border);
    transition: left .45s cubic-bezier(.5, 1.4, .5, 1), width .45s cubic-bezier(.5, 1.4, .5, 1), background .5s ease;
  }
  .tab {
    position: relative;
    display: flex; align-items: center; gap: 9px;
    padding: 12px 20px;
    border: 0; border-radius: 999px;
    background: none; color: var(--muted);
    font: inherit; font-size: .98rem; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: color .3s ease;
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-current="page"] { color: var(--fg); }
  .tab:focus-visible, .mode:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sep { width: 1px; height: 24px; margin-inline: 6px; background: var(--glass-border); }
  .mode {
    position: relative;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: none; color: var(--muted); cursor: pointer;
    transition: color .3s, rotate .5s ease;
  }
  .mode:hover { color: var(--fg); rotate: 30deg; }

  .panel { text-align: center; min-height: 4em; }
  .panel h1 { margin: 0 0 4px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
  .panel p { margin: 0; color: var(--muted); }

  @media (max-width: 480px) {
    .tab { padding: 12px; }
    .tab .t { display: none; }
    .tab[aria-current="page"] .t { display: inline; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="field" aria-hidden="true"></div>
<main>
  <nav class="liquid-nav" id="nav" aria-label="Main">
    <span class="lozenge" id="lozenge" aria-hidden="true"></span>
    <button type="button" class="tab" data-title="Home" data-text="Everything new since you last looked.">
      <svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg><span class="t">Home</span>
    </button>
    <button type="button" class="tab" data-title="Search" data-text="Look up people, posts and places.">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><span class="t">Search</span>
    </button>
    <button type="button" class="tab" aria-current="page" data-title="Messages" data-text="3 conversations are waiting for a reply.">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/></svg><span class="t">Messages</span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="mode" id="mode" aria-label="Switch to dark mode">
      <svg class="i" id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
      <svg class="i" id="moon" viewBox="0 0 24 24" hidden><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </nav>

  <section class="panel" id="panel" aria-live="polite">
    <h1>Messages</h1>
    <p>3 conversations are waiting for a reply.</p>
  </section>
</main>

<script>
  var root = document.documentElement;
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var lozenge = document.getElementById('lozenge');
  var nav = document.getElementById('nav');

  function moveTo(tab, animate) {
    if (!animate) lozenge.style.transition = 'none';
    lozenge.style.left = tab.offsetLeft + 'px';
    lozenge.style.width = tab.offsetWidth + 'px';
    if (!animate) { void lozenge.offsetWidth; lozenge.style.transition = ''; }
  }
  function select(tab) {
    tabs.forEach(function (t) { t === tab ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'); });
    // wait a frame so the active label has its final width on small screens
    requestAnimationFrame(function () { moveTo(tab, true); });
    document.getElementById('panel').innerHTML = '<h1>' + tab.dataset.title + '</h1><p>' + tab.dataset.text + '</p>';
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { select(t); }); });
  function current() { return document.querySelector('.tab[aria-current="page"]'); }
  window.addEventListener('resize', function () { moveTo(current(), false); });
  moveTo(current(), false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { moveTo(current(), false); });

  function isDark() {
    var t = root.getAttribute('data-theme');
    return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paintMode() {
    var d = isDark();
    document.getElementById('sun').toggleAttribute('hidden', d);
    document.getElementById('moon').toggleAttribute('hidden', !d);
    document.getElementById('mode').setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode');
  }
  document.getElementById('mode').addEventListener('click', function () {
    root.setAttribute('data-theme', isDark() ? 'light' : 'dark');
    paintMode();
  });
  paintMode();
</script>

</body>
</html>
