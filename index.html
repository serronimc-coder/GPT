<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <title>Scan Carte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="field" aria-hidden="true"></div>
  <header><span class="orb" aria-hidden="true"></span><h1>Scan Carte</h1></header>

  <main>
    <!-- Étape 1 : prise de vue -->
    <section id="screen-home" class="screen active">
      <div class="hero">
        <svg viewBox="0 0 64 40" aria-hidden="true"><rect x="2" y="2" width="60" height="36" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="currentColor"/><rect x="28" y="12" width="26" height="3" rx="1.5" fill="currentColor"/><rect x="28" y="19" width="18" height="3" rx="1.5" fill="currentColor"/><rect x="10" y="29" width="36" height="2" rx="1" fill="currentColor"/></svg>
        <p>Photographiez une ou plusieurs cartes de visite sur un fond uni et bien éclairé, sans qu'elles se touchent. Chaque carte est détectée, redressée et nettoyée.</p>
      </div>
      <label class="btn primary" for="file-camera">📷 Prendre une photo</label>
      <input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
      <label class="btn" for="file-gallery">🖼️ Importer des photos</label>
      <input id="file-gallery" type="file" accept="image/*" multiple hidden>
    </section>

    <!-- Étape 2 : ajustement des coins -->
    <section id="screen-crop" class="screen">
      <p class="crop-info"><strong id="crop-title"></strong> <span id="crop-hint"></span></p>
      <div class="stage" id="crop-stage"><canvas id="crop-canvas"></canvas></div>
    </section>

    <!-- Étape 3 : résultats -->
    <section id="screen-result" class="screen">
      <h2 id="result-title">Cartes scannées</h2>
      <div class="chips" role="radiogroup" aria-label="Mode d'amélioration">
        <button class="chip active" data-mode="color" role="radio" aria-checked="true">Couleur</button>
        <button class="chip" data-mode="document" role="radio" aria-checked="false">Document N&amp;B</button>
        <button class="chip" data-mode="gray" role="radio" aria-checked="false">Gris</button>
        <button class="chip" data-mode="original" role="radio" aria-checked="false">Brut</button>
      </div>
      <div id="grid" class="grid"></div>
      <button class="btn primary" id="save-all">💾 Tout enregistrer dans Photos</button>
      <label class="btn" for="file-more">＋ Ajouter d'autres photos</label>
      <input id="file-more" type="file" accept="image/*" multiple hidden>
      <button class="btn" id="again">Nouveau scan</button>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>

  <nav class="liquid-nav" id="nav" aria-label="Navigation">
    <span class="lozenge" id="lozenge" aria-hidden="true"></span>
    <button type="button" class="tab" id="tab-scan" data-screen="scan" aria-current="page">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.4-2h6.2l1.4 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="t">Scanner</span>
    </button>
    <button type="button" class="tab" id="tab-cards" data-screen="cards">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8.5" cy="11" r="1.6"/><path d="M13 10h5M13 13.5h3.5"/></svg><span class="t">Cartes</span><span class="count" id="count" hidden>0</span>
    </button>
  </nav>

  <!-- Barre d'actions du recadrage : même verre que la navbar, fixe à la même place pour toutes les photos -->
  <nav class="liquid-nav crop-bar" id="crop-bar" aria-label="Actions de recadrage" hidden>
    <button type="button" class="cbtn" id="card-add" aria-label="Ajouter une carte">
      <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 8v8M8 12h8"/></svg><span>Ajouter</span>
    </button>
    <button type="button" class="cbtn" id="card-del" aria-label="Retirer la carte sélectionnée">
      <svg class="i" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg><span>Retirer</span>
    </button>
    <button type="button" class="cbtn" id="crop-auto" aria-label="Détection automatique">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"/></svg><span>Auto</span>
    </button>
    <button type="button" class="cbtn" id="crop-cancel" aria-label="Ignorer cette photo">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg><span>Ignorer</span>
    </button>
    <button type="button" class="cbtn ok" id="crop-ok" aria-label="Valider">
      <svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span>Valider</span>
    </button>
  </nav>

  <script src="scanner.js"></script>
  <script src="app.js"></script>
</body>
</html>
